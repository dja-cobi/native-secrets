name: Cross-Platform CI (Linux, Windows, macOS, iOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    name: Linux (libsecret + NativeAOT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install libsecret & gnome-keyring
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-0 gnome-keyring dbus-x11
      - name: Run JIT & NativeAOT inside D-Bus session
        run: |
          dbus-run-session -- bash -c '
            echo -n "testpass" | gnome-keyring-daemon --unlock --components=secrets
            dotnet run --project src/NativeSecrets.Demo -c Release
            dotnet publish src/NativeSecrets.Demo -c Release -r linux-x64 -p:PublishAot=true -o ./aot-out
            ./aot-out/NativeSecrets.Demo
          '

  test-windows:
    name: Windows (Credential Manager + NativeAOT)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run JIT
        run: dotnet run --project src/NativeSecrets.Demo -c Release
      - name: Publish & Run NativeAOT
        run: |
          dotnet publish src/NativeSecrets.Demo -c Release -r win-x64 -p:PublishAot=true -o ./aot-out
          ./aot-out/NativeSecrets.Demo.exe

  test-apple:
    name: Apple (macOS, MacCatalyst & iOS Simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Apple workloads (iOS & MacCatalyst)
        run: dotnet workload install ios maccatalyst

      - name: Run macOS Demo (JIT & NativeAOT)
        run: |
          dotnet run --project src/NativeSecrets.Demo -c Release
          dotnet publish src/NativeSecrets.Demo -c Release -r osx-arm64 -p:PublishAot=true -p:StripSymbols=true -o ./aot-out
          chmod +x ./aot-out/NativeSecrets.Demo
          ./aot-out/NativeSecrets.Demo

      - name: Create Entitlements.plist for Keychain access
        run: |
          cat << 'EOF' > Entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>keychain-access-groups</key>
              <array>
                  <string>$(AppIdentifierPrefix)com.companyname.NativeSecrets.IosDemo</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Build & Run MacCatalyst Demo (SecKeyChain)
        run: |
          dotnet build src/NativeSecrets.IosDemo/NativeSecrets.IosDemo.csproj -f net10.0-maccatalyst -c Release
          APP_PATH="src/NativeSecrets.IosDemo/bin/Release/net10.0-maccatalyst/maccatalyst-arm64/NativeSecrets.IosDemo.app"
          codesign --force --sign - --entitlements Entitlements.plist "$APP_PATH"
          "$APP_PATH/Contents/MacOS/NativeSecrets.IosDemo"

      - name: Build & Run iOS Simulator Demo (SecKeyChain)
        run: |
          dotnet build src/NativeSecrets.IosDemo/NativeSecrets.IosDemo.csproj -f net10.0-ios -r iossimulator-arm64 -c Release
          APP_PATH="src/NativeSecrets.IosDemo/bin/Release/net10.0-ios/iossimulator-arm64/NativeSecrets.IosDemo.app"
          codesign --force --sign - --entitlements Entitlements.plist "$APP_PATH"

          UDID=$(xcrun simctl list devices available | grep "iPhone" | head -n 1 | grep -oE '[A-F0-9-]{36}')
          echo "Booting iOS Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch --console-pty "$UDID" com.companyname.NativeSecrets.IosDemo | tee ios_output.log
          grep -q "SUCCESS: Apple SecKeyChain works properly!" ios_output.log
