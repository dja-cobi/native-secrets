name: Cross-Platform Test & NativeAOT

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-windows:
    name: Test on Windows (Credential Manager + NativeAOT)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: dotnet build -c Release

      - name: Run Demo (JIT)
        run: dotnet run --project src/NativeSecrets.Demo -c Release

      - name: Publish & Run NativeAOT binary
        run: |
          dotnet publish src/NativeSecrets.Demo -c Release -r win-x64 -p:PublishAot=true -o ./aot-out
          ./aot-out/NativeSecrets.Demo.exe

  test-macos:
    name: Test on macOS (Keychain + NativeAOT)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Apple workloads (for iOS / MacCatalyst targets)
        run: dotnet workload install ios maccatalyst

      - name: Build solution
        run: dotnet build -c Release

      - name: Run Demo (JIT)
        run: dotnet run --project src/NativeSecrets.Demo -c Release

      - name: Publish & Run NativeAOT binary (osx-arm64)
        run: |
          dotnet publish src/NativeSecrets.Demo -c Release -r osx-arm64 -p:PublishAot=true -o ./aot-out
          chmod +x ./aot-out/NativeSecrets.Demo
          ./aot-out/NativeSecrets.Demo
